name: Core Tests

# no permissions by default
permissions: {}

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.11", "3.15" ]
        os: [ ubuntu-latest ]
        include:
          - os: windows-latest
            python-version: "3.15"
          - os: macos-latest
            python-version: "3.15"
          - os: macos-15-intel
            python-version: "3.15"
      fail-fast: false
    permissions:
      actions: none

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install erddapy
      run: |
        pip install --group dev
        pip install -e .

    - name: Full Tests
      # Use the --record-mode=rewrite if you need to re-record the cassetts.
      run: |
        python -m pytest -rxs tests
